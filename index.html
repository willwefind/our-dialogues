<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Our Dialogues</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <header class="side-head">
      <div class="eyebrow">LOCAL-FIRST ARCHIVE READER</div>
      <h1>Our Dialogues</h1>
      <p>把曾经说过的话，重新翻出来。</p>

      <label class="pick">
        <input id="fileInput" type="file" accept=".json,.zip,application/json,application/zip" multiple hidden>
        <span>选择 JSON / ZIP</span>
      </label>

      <div id="status" class="status">文件只在本机浏览器中解析。</div>
    </header>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索标题或正文…">
    </div>

    <div id="archiveMeta" class="archive-meta"></div>
    <nav id="conversationList" class="conversation-list"></nav>
  </aside>

  <main id="main">
    <div class="toolbar">
      <button id="sidebarToggle" class="ghost" title="显示/隐藏侧栏">☰</button>
      <div id="currentTitle" class="current-title">尚未载入档案</div>
      <label><input id="hideUser" type="checkbox"> 隐藏我的发言</label>
      <label><input id="showThinking" type="checkbox"> 展开 Thinking</label>
      <select id="theme">
        <option value="paper">纸</option>
        <option value="night">夜</option>
        <option value="mist">雾</option>
      </select>
    </div>

    <section id="welcome" class="welcome">
      <div class="welcome-card">
        <div class="mark">“</div>
        <h2>I knew the conversation existed.<br>I just wanted to find it again.</h2>
        <p>选择一个 AI 对话导出 JSON 或 ZIP。Reader 会自动识别格式，并在本地转换为统一阅读结构。</p>
        <p class="small">当前是 v0.1 骨架。Ciel House / Mufy 已有适配器；ChatGPT 官方导出适配器将在真实 2026 样本上校准。</p>
      </div>
    </section>

    <article id="reader" class="reader hidden">
      <header class="conversation-head">
        <h2 id="readerTitle"></h2>
        <div id="readerMeta" class="reader-meta"></div>
      </header>
      <div id="messages"></div>
    </article>
  </main>

  <script src="src/core/schema.js"></script>
  <script src="src/core/zip.js"></script>
  <script src="src/adapters/normalized.js"></script>
  <script src="src/adapters/ciel-house.js"></script>
  <script src="src/adapters/mufy.js"></script>
  <script src="src/adapters/chatgpt-official.js"></script>
  <script src="src/adapters/registry.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
